<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | PageText</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to the free web-to-text converter.">
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --text2: #8b949e; --accent: #58a6ff; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 20px; width: 100%; }
    header { border-bottom: 1px solid var(--border); padding: 16px 0; background: var(--surface); }
    header .container { display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.4rem; font-weight: 700; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    main { padding: 80px 0; text-align: center; line-height: 1.7; }
    .code { font-size: 5rem; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 12px; }
    p { color: var(--text2); margin-bottom: 24px; }
    .btn { display: inline-block; background: var(--accent); color: #0d1117; text-decoration: none; font-weight: 600; padding: 12px 28px; border-radius: 8px; }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
<header>
  <div class="container">
    <a href="/" class="logo">Page<span>Text</span></a>
  </div>
</header>
<main class="container">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" class="btn">Back to PageText</a>
</main>
</body>
</html>
